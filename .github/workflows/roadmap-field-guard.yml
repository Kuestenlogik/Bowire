name: Roadmap field guard

# An item that has been PULLED must name the version it was pulled for.
#
# The board carries two independent axes: `Status` is where the work sits in
# the flow, `Release` is which product version it targets. Backlog is the
# reservoir — everything rests there, unassigned, until someone pulls it. So
# an empty `Release` is perfectly correct while `Status` is still `Backlog`.
# Moving an item to `Next up` IS the decision about when it ships, and an
# item in flight with no version is the contradiction worth catching.
#
# This guard used to demand "never empty" instead. That forced a placeholder
# `Backlog` option onto the Release field — a category error, since a release
# is a version and "backlog" is a place in the flow — and it protected
# nothing: generate-roadmap.mjs already treated the placeholder and an empty
# field identically. Worse, seeding every new item made the check vacuous:
# nothing was ever empty, so the guard passed while untriaged work piled up.
# Guarding the transition means something; guarding the birth did not.
#
# Runs daily + on demand. A red run means: give the listed items a version,
# or push them back to Backlog.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

# `issues: write` is for the tracking issue the failure path files. The PAT
# below carries its own scopes, but the job token still has to permit it —
# a workflow-level `contents: read` alone makes the create call 403 and the
# guard would then fail for the wrong reason.
permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: Every board item has a Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
    steps:
      # Needed for the local composite action below — a `uses: ./…` step has
      # nothing to resolve without the repo on disk.
      - uses: actions/checkout@v7

      - name: Find pulled items with no Release
        id: scan
        run: |
          gh api graphql --paginate -f query='
            query($endCursor: String) {
              organization(login: "Kuestenlogik") {
                projectV2(number: 2) {
                  items(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      content {
                        __typename
                        ... on Issue { number state url repository { nameWithOwner } }
                      }
                      release: fieldValueByName(name: "Release") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                      status: fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }' > pages.json

          # A violation is an OPEN issue that has left Backlog without being
          # given a version. Still in Backlog with no Release is the normal
          # resting state and must NOT be reported — that was the old rule,
          # and it made the check vacuous once every item got seeded.
          #
          # A missing Status counts as pulled: the field is never empty in
          # practice (GitHub seeds it), so an absent one means something
          # unusual and is worth a look rather than a silent pass.
          jq -rs '[ .[].data.organization.projectV2.items.nodes[]
                    | select(.content.__typename == "Issue" and .content.state == "OPEN")
                    | select(.release == null)
                    | select((.status.name // "unset") != "Backlog")
                    | "\(.content.repository.nameWithOwner)#\(.content.number)\t\(.content.url)\t\(.status.name // "unset")" ]
                  | .[]' pages.json > offenders.txt || true

          COUNT=$(grep -c . offenders.txt || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "✅ Every pulled item names a Release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ❌ $COUNT item(s) pulled without a Release"
            echo ""
            echo "These have left Backlog but name no version. Pulling an item"
            echo "is the decision about when it ships — give each one a version,"
            echo "or move it back to Backlog:"
            echo ""
            while IFS=$'\t' read -r ref url status; do
              [ -z "$ref" ] && continue
              echo "- [\`$ref\`]($url) — Status: \`$status\`"
            done < offenders.txt
          } >> "$GITHUB_STEP_SUMMARY"

          # Also hand the list to the next step, which files it where someone
          # will actually see it.
          {
            while IFS=$'\t' read -r ref url status; do
              [ -z "$ref" ] && continue
              echo "- $ref (Status: $status) — $url"
            done < offenders.txt
          } > offenders.md
          {
            echo "count=$COUNT"
            echo "offenders<<EOF"
            cat offenders.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 1

      # A red scheduled run is not a notification. This guard went red on four
      # consecutive days in August 2026 with three untriaged items on the
      # board, and nobody noticed — a daily cron failing in the Actions tab
      # looks exactly like a daily cron nobody opened. The same lesson as the
      # publish channels (#237), so the same remedy: leave a mark that
      # outlives the run.
      - name: File a tracking issue
        if: failure() && steps.scan.outputs.count != ''
        uses: ./.github/actions/publish-failure-issue
        with:
          channel: roadmap-release-field
          hint: |
            These items have left `Backlog` without naming a version. Pulling
            an item is the decision about when it ships, so one in flight with
            no `Release` is a decision that was skipped — and it will not
            appear on the versioned roadmap `scripts/ci/generate-roadmap.mjs`
            renders.

            ${{ steps.scan.outputs.offenders }}

            Give each one a version, or move it back to `Backlog` if it was
            pulled by accident.

            An item still resting in `Backlog` with no `Release` is **not** a
            violation and is never listed here — that is the normal state of
            unplanned work.
          token: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
