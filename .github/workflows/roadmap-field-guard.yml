name: Roadmap field guard

# Every open item names the work section it belongs to — its milestone.
#
# Since 2026-09-19 the board carries three axes: `Status` is where the work
# sits in the flow, the `Milestone` is the ordered work section it belongs
# to (M1, M2, … — mirrored into the sibling repos), and `Release` is the
# version it shipped in, stamped at the cut and empty before. An open issue
# without a milestone has skipped the one decision every ticket gets at
# birth — that is the contradiction worth catching. (It used to check the
# `Release` field once an item left Backlog; the version is no longer known
# before the cut.)
#
# This guard used to demand "never empty" instead. That forced a placeholder
# `Backlog` option onto the Release field — a category error, since a release
# is a version and "backlog" is a place in the flow — and it protected
# nothing: generate-roadmap.mjs already treated the placeholder and an empty
# field identically. Worse, seeding every new item made the check vacuous:
# nothing was ever empty, so the guard passed while untriaged work piled up.
# Guarding the transition means something; guarding the birth did not.
#
# Runs daily + on demand. A red run means: give the listed items a version,
# or push them back to Backlog.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

# `issues: write` is for the tracking issue the failure path files. The PAT
# below carries its own scopes, but the job token still has to permit it —
# a workflow-level `contents: read` alone makes the create call 403 and the
# guard would then fail for the wrong reason.
permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: Every open item names its milestone
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
    steps:
      # Needed for the local composite action below — a `uses: ./…` step has
      # nothing to resolve without the repo on disk.
      - uses: actions/checkout@v7

      - name: Find open items with no milestone
        id: scan
        run: |
          gh api graphql --paginate -f query='
            query($endCursor: String) {
              organization(login: "Kuestenlogik") {
                projectV2(number: 2) {
                  items(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      content {
                        __typename
                        ... on Issue { number state url milestone { title } repository { nameWithOwner } }
                      }
                      status: fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }' > pages.json

          # A violation is an OPEN issue without a milestone, wherever it sits
          # in the flow: the section is decided when the ticket is born, and
          # the sibling repos mirror the main repo's sections as their own
          # milestones, so "no milestone" is never a legitimate resting state.
          jq -rs '[ .[].data.organization.projectV2.items.nodes[]
                    | select(.content.__typename == "Issue" and .content.state == "OPEN")
                    | select(.content.milestone == null)
                    | "\(.content.repository.nameWithOwner)#\(.content.number)\t\(.content.url)\t\(.status.name // "unset")" ]
                  | .[]' pages.json > offenders.txt || true

          COUNT=$(grep -c . offenders.txt || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "✅ Every open item names its milestone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ❌ $COUNT open item(s) without a milestone"
            echo ""
            echo "These name no work section. Give each one the milestone it"
            echo "belongs to (a sibling repo mirrors the main repo's sections"
            echo "as its own milestones), or close it:"
            echo ""
            while IFS=$'\t' read -r ref url status; do
              [ -z "$ref" ] && continue
              echo "- [\`$ref\`]($url) — Status: \`$status\`"
            done < offenders.txt
          } >> "$GITHUB_STEP_SUMMARY"

          # Also hand the list to the next step, which files it where someone
          # will actually see it.
          {
            while IFS=$'\t' read -r ref url status; do
              [ -z "$ref" ] && continue
              echo "- $ref (Status: $status) — $url"
            done < offenders.txt
          } > offenders.md
          {
            echo "count=$COUNT"
            echo "offenders<<EOF"
            cat offenders.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 1

      # A red scheduled run is not a notification. This guard went red on four
      # consecutive days in August 2026 with three untriaged items on the
      # board, and nobody noticed — a daily cron failing in the Actions tab
      # looks exactly like a daily cron nobody opened. The same lesson as the
      # publish channels (#237), so the same remedy: leave a mark that
      # outlives the run.
      - name: File a tracking issue
        if: failure() && steps.scan.outputs.count != ''
        uses: ./.github/actions/publish-failure-issue
        with:
          channel: roadmap-release-field
          hint: |
            These open items name no milestone. The milestone is the work
            section a ticket belongs to (M1, M2, … — docs/contributing/
            project-board.md, "Milestones and releases"); it is decided when
            the ticket is born, and an item without one does not appear on
            the roadmap `scripts/ci/generate-roadmap.mjs` renders.

            ${{ steps.scan.outputs.offenders }}

            Give each one the milestone it belongs to — a sibling repo
            mirrors the main repo's sections as its own milestones — or close
            it. The `Release` field stays empty until the cut stamps the
            version.
          token: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
