name: Roadmap field guard

# "Release" is a mandatory board field — the roadmap
# (scripts/ci/generate-roadmap.mjs) buckets every item by it, so an item
# with an empty field silently drops off the versioned roadmap. Projects v2
# has no native required-field, so this is the enforcement:
#   * add-to-project.yml seeds new items to "Backlog" (never empty at birth)
#   * this guard is the backstop — it fails if any OPEN board issue has NO
#     Release at all (Backlog is a valid value, not a violation),
#     catching items added outside the automation or fields cleared by hand.
#
# Runs daily + on demand. A red run is the signal to triage the listed
# items on the board (set Release to a version or Backlog).

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

# `issues: write` is for the tracking issue the failure path files. The PAT
# below carries its own scopes, but the job token still has to permit it —
# a workflow-level `contents: read` alone makes the create call 403 and the
# guard would then fail for the wrong reason.
permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: Every board item has a Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
    steps:
      # Needed for the local composite action below — a `uses: ./…` step has
      # nothing to resolve without the repo on disk.
      - uses: actions/checkout@v7

      - name: Find OPEN board issues missing Release
        id: scan
        run: |
          gh api graphql --paginate -f query='
            query($endCursor: String) {
              organization(login: "Kuestenlogik") {
                projectV2(number: 2) {
                  items(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      content {
                        __typename
                        ... on Issue { number state url repository { nameWithOwner } }
                      }
                      fieldValueByName(name: "Release") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }' > pages.json

          # Backlog counts as set; a violation is a completely unset field on
          # an OPEN issue. jq -s slurps the per-page objects into one array.
          jq -rs '[ .[].data.organization.projectV2.items.nodes[]
                    | select(.content.__typename == "Issue" and .content.state == "OPEN")
                    | select(.fieldValueByName == null)
                    | "\(.content.repository.nameWithOwner)#\(.content.number)\t\(.content.url)" ]
                  | .[]' pages.json > offenders.txt || true

          COUNT=$(grep -c . offenders.txt || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "✅ Every open board item has a Release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ❌ $COUNT open board item(s) missing a Release"
            echo ""
            echo "\"Release\" is mandatory. Triage each item on the board"
            echo "(set a version or **Backlog**):"
            echo ""
            while IFS=$'\t' read -r ref url; do
              [ -z "$ref" ] && continue
              echo "- [\`$ref\`]($url)"
            done < offenders.txt
          } >> "$GITHUB_STEP_SUMMARY"

          # Also hand the list to the next step, which files it where someone
          # will actually see it.
          {
            while IFS=$'\t' read -r ref url; do
              [ -z "$ref" ] && continue
              echo "- $ref — $url"
            done < offenders.txt
          } > offenders.md
          {
            echo "count=$COUNT"
            echo "offenders<<EOF"
            cat offenders.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 1

      # A red scheduled run is not a notification. This guard went red on four
      # consecutive days in August 2026 with three untriaged items on the
      # board, and nobody noticed — a daily cron failing in the Actions tab
      # looks exactly like a daily cron nobody opened. The same lesson as the
      # publish channels (#237), so the same remedy: leave a mark that
      # outlives the run.
      - name: File a tracking issue
        if: failure() && steps.scan.outputs.count != ''
        uses: ./.github/actions/publish-failure-issue
        with:
          channel: roadmap-release-field
          hint: |
            These open board items have no **Release** value, so
            `scripts/ci/generate-roadmap.mjs` drops them from the versioned
            roadmap entirely. Set a version or **Backlog** on each:

            ${{ steps.scan.outputs.offenders }}

            If they arrived without a `roadmap` label, check the issue
            templates — GitHub discards template labels that do not exist in
            the repo, silently, and `add-to-project.yml` (which seeds the
            field) keys on that label.
          token: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
