name: Roadmap field guard

# Every open ticket is planned: it is on the board and names its Product (the
# artifact that ships it, and so the version line it counts in), the Release
# it is planned for in that line (`2.8`) and the milestone of that release
# (`v2.8 — <theme>`) — and the three agree. docs/contributing/project-board.md,
# "Products, releases and milestones"; the rules are scripts/ci/release-plan.mjs.
#
# From 2026-09-19 to 2026-09-29 the Release field was stamped at the cut and
# empty before it. Nothing then said when the next release was due, and 2.8
# waited three weeks behind 43 finished tickets. A release is planned again;
# this guard is what keeps it planned. It also sweeps every product repository
# for open issues that are not on the board at all: the board only adds issues
# labelled `roadmap` on its own, and 20 of them had been missed.
#
# Runs daily + on demand.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

# `issues: write` is for the tracking issue the failure path files. The PAT
# below carries its own scopes, but the job token still has to permit it —
# a workflow-level `contents: read` alone makes the create call 403 and the
# guard would then fail for the wrong reason.
permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: Every open ticket is planned
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
    steps:
      # Also needed for the local composite action below.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check the plan
        id: scan
        run: |
          set +e
          node scripts/ci/check-board.mjs --markdown > offenders.md
          code=$?
          set -e
          cat offenders.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then exit 0; fi
          {
            echo "count=$(grep -c '^- ' offenders.md)"
            echo "offenders<<EOF"
            cat offenders.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 1

      # A red scheduled run is not a notification: this guard once went red on
      # four consecutive days and nobody noticed. The tracking issue outlives
      # the run.
      - name: File a tracking issue
        if: failure() && steps.scan.outputs.count != ''
        uses: ./.github/actions/publish-failure-issue
        with:
          channel: roadmap-release-field
          hint: |
            These open tickets are not planned. Each one needs to be on the
            board with Product, Release and the milestone of that release,
            and the three have to agree (docs/contributing/project-board.md,
            "Products, releases and milestones").

            ${{ steps.scan.outputs.offenders }}

            Put the ticket on the board, fill in what is missing, or close it.
          token: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
