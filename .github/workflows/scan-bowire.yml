name: "Scan: Bowire itself"

# Bowire's scanner against the HTTP surface Bowire actually ships — and, unlike
# the other two scan jobs, these findings ARE uploaded (#614).
#
# The three scan jobs answer three different questions:
#
#   * scan-self     — "does the composite action still run end-to-end?" It
#                     scans example.com, which is stable and needs nothing
#                     started. example.com's missing headers are not ours, so
#                     it does not upload.
#   * scan-dogfood  — "does the scanner still find what it should?" It starts
#                     a sample and asserts the findings against a frozen set.
#                     The findings describe the harness, so it does not upload.
#   * this job      — "what does Bowire expose?" It starts the real tool and
#                     uploads, because the target is the product.
#
# The gap this closes: CodeQL reads the source, and nothing sends a request to
# a running instance. That is exactly what `bowire scan` is for, and it was
# pointed at everything except us.
#
# Why the findings are filtered by rule rather than gated on severity.
# Measured against a real instance: the findings that are ours (missing
# security headers, a version-disclosing Server banner) are all low, so a
# `--severity medium` gate would drop every one of them and keep nothing. If a
# finding ever does describe the harness instead of the product, it gets
# excluded by name in scripts/ci/harness-scan-rules.json, where it can be
# argued with.
#
# Why the run serves HTTPS (#634). It used to serve plaintext, which produced
# a high-severity "target serves plaintext http://" finding that said nothing
# about Bowire, and it made `BWR-REST-001` unclosable: Strict-Transport-
# Security is only sent over TLS, per RFC 6797 §8.1, so over http:// that rule
# could never be satisfied honestly. Running the scan the way an operator
# deploys removes both problems, and it turns this job into the end-to-end
# proof that Bowire honours ASPNETCORE_URLS and Kestrel:Certificates — the
# whole point of #634. Note there is deliberately no `--port`: passing it
# overrides the configured endpoint, which is the behaviour under test.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/actions/bowire-scan/**'
      - '.github/workflows/scan-bowire.yml'
      - 'scripts/ci/filter-harness-findings.mjs'
      - 'scripts/ci/harness-scan-rules.json'
  # Weekly, because a finding can appear without src/ changing: an updated
  # template corpus, a new probe, a dependency that starts sending a header.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  # A push-triggered run must not be cancelled by the next push: on main every
  # commit is its own subject, and superseding one loses that commit's result
  # rather than saving work.
  group: scan-bowire-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read
  # The whole point of this job, and the one thing the other two scan jobs
  # deliberately do not ask for.
  security-events: write

jobs:
  scan:
    name: scan the shipped surface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # From source, not from NuGet: the point is to scan what this commit
      # serves. The scanner itself is the published tool (the composite action
      # installs it), which is the right way round — a released scanner
      # against the build under review.
      - name: Build the tool
        run: dotnet build src/Kuestenlogik.Bowire.Tool -c Release -m:1 -nodeReuse:false

      # A self-signed certificate rather than `dotnet dev-certs`: it is
      # reproducible, it carries the SANs the scanner connects by, and it goes
      # in through Kestrel:Certificates — the same path a real deployment uses,
      # so the run exercises the configuration it documents.
      - name: Issue a certificate for the run
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
            -keyout run-key.pem -out run-cert.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          openssl pkcs12 -export -out run-cert.pfx \
            -inkey run-key.pem -in run-cert.pem -passout pass:bowire-ci
          echo "BOWIRE_CERT=$PWD/run-cert.pfx" >> "$GITHUB_ENV"

      - name: Start Bowire
        run: |
          set -euo pipefail

          # A profile of its own, so findings come from the product rather than
          # from state a previous step happened to leave behind. BOWIRE_DATA_DIR
          # points every storage scope at one directory (#616), which is what
          # makes "known-empty" a single line instead of a cleanup ritual.
          BOWIRE_DATA_DIR="$(mktemp -d)"
          export BOWIRE_DATA_DIR
          echo "BOWIRE_DATA_DIR=$BOWIRE_DATA_DIR" >> "$GITHUB_ENV"

          # Address and certificate through ASP.NET's own configuration, with
          # no Bowire-specific flag involved — if Bowire ever goes back to
          # forcing its own address, this job serves plaintext on 5080, the
          # scan of :5190 cannot connect, and the build says so.
          export ASPNETCORE_URLS="https://127.0.0.1:5190"
          export Kestrel__Certificates__Default__Path="$BOWIRE_CERT"
          export Kestrel__Certificates__Default__Password="bowire-ci"

          nohup dotnet artifacts/bin/Kuestenlogik.Bowire.Tool/release/bowire.dll \
            --no-browser --enable-mcp-adapter \
            > bowire.log 2>&1 &
          echo $! > bowire.pid

          # Polled with a request rather than by grepping the banner. Bowire
          # prints "Bowire is running at …" before Kestrel reports listening,
          # and under load the gap is long enough that a banner-based wait
          # scans a socket nobody is accepting on yet.
          for _ in $(seq 1 90); do
            # -k because the certificate is this run's own. The scan steps
            # do the same; a scanner that refused it would report nothing at
            # all, which is not the same as finding nothing wrong.
            if curl -fsSk -o /dev/null --max-time 2 https://localhost:5190/; then
              echo "Bowire is answering over TLS on :5190"
              exit 0
            fi
            if ! kill -0 "$(cat bowire.pid)" 2>/dev/null; then
              echo "::error::Bowire exited before it served a request."
              cat bowire.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::Bowire did not answer on https://localhost:5190 within 90s. Check the log for the address it actually bound."
          cat bowire.log
          exit 1

      # Three targets rather than one. The findings carry the probed URL in
      # their logical location and fingerprint, so alerts stay distinguishable
      # — a missing header on the MCP endpoint is a different alert from the
      # same header missing on the workbench, and it should be.
      - name: Scan the workbench
        uses: ./.github/actions/bowire-scan
        with:
          target: https://localhost:5190/
          allow-self-signed: 'true'
          artifact-name: bowire-self-workbench
          templates: docs/security/examples
          suite: owasp-api
          severity: low
          upload-to-code-scanning: 'false'

      - name: Keep the workbench findings
        run: mkdir -p sarif && mv findings.sarif sarif/workbench.sarif

      - name: Scan the API surface
        uses: ./.github/actions/bowire-scan
        with:
          target: https://localhost:5190/api/plugins
          allow-self-signed: 'true'
          artifact-name: bowire-self-api
          templates: docs/security/examples
          suite: owasp-api
          severity: low
          upload-to-code-scanning: 'false'

      - name: Keep the API findings
        run: mv findings.sarif sarif/api.sarif

      - name: Scan the MCP endpoint
        uses: ./.github/actions/bowire-scan
        with:
          target: https://localhost:5190/mcp
          allow-self-signed: 'true'
          artifact-name: bowire-self-mcp
          templates: docs/security/examples
          suite: owasp-api
          severity: low
          upload-to-code-scanning: 'false'

      - name: Keep the MCP findings
        run: mv findings.sarif sarif/mcp.sarif

      - name: Drop what describes the harness rather than Bowire
        run: >
          node scripts/ci/filter-harness-findings.mjs
          sarif/workbench.sarif sarif/api.sarif sarif/mcp.sarif

      # No severity gate on the build. A new finding here is news, not a
      # regression against a frozen expectation — that assertion is
      # scan-dogfood's job. This one reports; the Security tab is where it is
      # read, and failing the build on a banner-level nit would only teach
      # people to ignore a red cross.
      #
      # One upload per surface, each with its own category. Code Scanning
      # stopped combining several SARIF runs under one category in July 2025,
      # so a single directory upload is rejected outright — and the split is
      # the better shape anyway: the Security tab groups by category, so
      # "missing headers on the MCP endpoint" stays a different line from the
      # same header missing on the workbench.
      - name: Upload the workbench findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif/workbench.sarif
          category: bowire-self-workbench

      - name: Upload the API findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif/api.sarif
          category: bowire-self-api

      - name: Upload the MCP findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif/mcp.sarif
          category: bowire-self-mcp

      # The scan steps already upload each SARIF unfiltered, under
      # bowire-self-<surface>. This is the same set after filtering, so what
      # was dropped is visible by diffing the two rather than by trusting the
      # log line that says it happened.
      - name: Keep the filtered findings as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bowire-self-filtered
          path: sarif/
          if-no-files-found: warn

      - name: Bowire log
        if: always()
        run: cat bowire.log || true
