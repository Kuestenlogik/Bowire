name: "Scan: smoke (public target)"

# Self-smoke for the bowire-scan composite action
# (.github/actions/bowire-scan). Runs the action against a known-stable
# public target (example.com) so we can verify end-to-end that:
#   1. The action's tool-install path still resolves.
#   2. The scan emits a SARIF file the upload-sarif action accepts.
#   3. The seed templates + built-in checks fire without throwing.
#
# We deliberately do NOT scan a sample server we'd have to spin up here —
# that adds a moving piece (docker compose / health-check / cleanup) whose
# failures would mask real regressions in the action. example.com is HTTPS,
# Cloudflare-fronted, and predictably surfaces the low-severity TLS-1.0/1.1
# + banner-disclosure findings the built-in checks ship with, which is
# exactly what we want to assert the pipeline survives.
#
# We expect (and want) findings here — the test is "the action runs to
# completion and SARIF lands", not "the target is clean". `bowire scan`
# exits 0 even with findings (findings are the product), so the job stays
# green naturally.

on:
  # Manual trigger for ad-hoc validation after editing the action.
  workflow_dispatch:
  # Re-run whenever the action itself changes so a broken refactor is
  # caught on the PR that introduces it, not on the next consumer.
  pull_request:
    paths:
      - '.github/actions/bowire-scan/**'
      - '.github/workflows/scan-smoke.yml'
  # Weekly smoke so a silent break (e.g. nuget.org tool de-list, .NET SDK
  # channel rotation) surfaces inside a week rather than the next time a
  # downstream consumer tries to wire the action.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  smoke:
    name: scan example.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the local action + seed templates)
        uses: actions/checkout@v7

      - name: Run bowire scan
        uses: ./.github/actions/bowire-scan
        with:
          target: https://example.com
          # Seed templates live in this repo at the default path — pass them
          # explicitly so the smoke also exercises the template-loading path,
          # not only the built-in checks.
          templates: docs/security/examples
          severity: low
          # Do NOT upload to Code Scanning — example.com's missing security
          # headers belong to example.com, not to Bowire. The SARIF still
          # uploads as a build artifact (`bowire-findings`) for inspection.
          upload-to-code-scanning: 'false'
