name: "Dogfood: PR report action"

# Exercises Kuestenlogik/bowire-action end-to-end against a local `bowire mock`
# target. The action moved to its own repository (#582); this workflow stayed
# behind on purpose and now points at the published action, which makes it the
# integration test in the direction that matters here: a CLI change in THIS
# repo breaking the action is caught before anyone else meets it.
#
# The action's own repo tests that the action wires up; this one tests that the
# CLI it drives still behaves. Neither replaces the other.
#
# Pinned to a commit SHA, not to `@v1`. The moving alias is the right thing
# for consumers — it is what the action's README recommends, and it carries
# fixes automatically — but a workflow in this repo must not re-resolve to
# whatever that tag points at today. Same rule every other third-party action
# here follows, and code scanning flags the alias form (alert 1821).
# Dependabot's github-actions ecosystem keeps the pin current.
#
# build-from-source: true so the still-unreleased `bowire diff` is available —
# that is also why this test cannot move to the action's repo, which has no
# Bowire source tree. External consumers pin the published tool instead.

on:
  workflow_dispatch:
  # Bowire's own work lands straight on main rather than through PRs, so a
  # pull_request-only trigger meant every change shipped unexercised. The
  # same paths on push keep this honest for the way the repo actually
  # commits.
  #
  # No path filter. The action drives `bowire diff`, `test` and `scan`, which
  # reach across most of the tree, and the filter that used to sit here named
  # only the Tool project — so a change anywhere else could break the report
  # and nothing would run. Deciding up front which paths can affect an
  # end-to-end run is the guess that keeps being wrong; the run is a few
  # minutes and catches what a filter would have to predict.
  push:
    branches: [main]
  pull_request:
  # Weekly, and this is the trigger that matters since the action moved to
  # its own repository (#582). A new action release changes nothing under
  # `src/**`, so no path filter here can notice it — without a schedule, a
  # break between the published action and this CLI would surface only when
  # someone happened to touch the tree. Offset from scan-dogfood's Monday
  # slot so the two do not contend for a runner.
  schedule:
    - cron: '23 7 * * 2'

concurrency:
  group: pr-report-dogfood-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  selftest:
    name: Run bowire-pr against a local mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build bowire (for the mock + base snapshot)
        run: dotnet build src/Kuestenlogik.Bowire.Tool/Kuestenlogik.Bowire.Tool.csproj -c Release --nologo

      - name: Put a bowire shim on PATH
        run: |
          dll="$GITHUB_WORKSPACE/artifacts/bin/Kuestenlogik.Bowire.Tool/release/bowire.dll"
          test -f "$dll" || { echo "::error::bowire.dll not found at $dll"; exit 1; }
          printf '#!/usr/bin/env bash\nexec dotnet "%s" "$@"\n' "$dll" > "$RUNNER_TEMP/bowire"
          chmod +x "$RUNNER_TEMP/bowire"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Start the mock target
        run: |
          nohup bowire mock \
            --schema tests/Kuestenlogik.Bowire.Mock.Tests/Fixtures/weather.openapi.yaml \
            --port 6000 --host 127.0.0.1 > mock.log 2>&1 &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:6000/ 2>/dev/null; then
              echo "mock accepting connections after ${i}s"; break
            fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:6000/ 2>/dev/null || { echo "::error::mock never came up"; cat mock.log; exit 1; }

      - name: Capture the base snapshot
        run: bowire diff snapshot http://127.0.0.1:6000 --protocol rest -o base.snapshot.json

      # A one-step flow against the mock, so the action's Tests section has
      # something to run and the Perf section has timings to diff.
      - name: Write the flow + capture the base timings
        run: |
          cat > flow.json <<'JSON'
          {
            "id": "selftest",
            "name": "weather smoke",
            "nodes": [
              {
                "id": "get-weather",
                "type": "request",
                "protocol": "rest",
                "service": "Weather",
                "method": "getCurrent",
                "serverUrl": "http://127.0.0.1:6000",
                "expectations": [
                  { "kind": "status", "op": "eq", "value": "200" }
                ]
              }
            ]
          }
          JSON
          # The base-branch report the Perf section diffs against. Same run
          # against the same mock, so the selftest asserts the plumbing, not
          # a synthetic regression.
          bowire test flow.json --junit base-test.xml --fail-on never || true
          test -f base-test.xml || { echo "::error::no baseline JUnit produced"; exit 1; }

      - name: Run the PR-report action
        uses: Kuestenlogik/bowire-action@bb2b26379cac1a343cc8e12260112dd490e5ae01 # v1.0.1
        with:
          target: http://127.0.0.1:6000
          protocol: rest
          base-snapshot: base.snapshot.json
          test: flow.json
          test-baseline: base-test.xml
          scan: 'true'
          build-from-source: 'true'
          fail-on-schema: none
          fail-on-tests: never
          fail-on-scan: never
          fail-on-perf: never

      - name: The report carries every section
        run: |
          test -f bowire-report.md || { echo "::error::no report produced"; exit 1; }
          cat bowire-report.md
          grep -q '## Perf' bowire-report.md || { echo "::error::Perf section missing from the report"; exit 1; }
          grep -q '| Perf |' bowire-report.md || { echo "::error::Perf row missing from the status table"; exit 1; }

      - name: Stop the mock
        if: always()
        run: kill "${MOCK_PID}" 2>/dev/null || true
