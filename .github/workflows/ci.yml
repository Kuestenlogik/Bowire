name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A failed run has no other way back: `ci.yml` produces the coverage
  # upload, and an infrastructure failure (the Actions outage on
  # 2026-08-26, say) leaves no artefact and no way to ask for one
  # short of pushing an empty commit.
  workflow_dispatch:

# Superseding a run is right on a PR and wrong on main: Codecov ingests
# the report from whichever run finishes, so cancelling an in-flight
# main build drops that commit's coverage on the floor and the next
# report compares against a gap. PRs have no such contract — the newest
# push is the only one anybody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # setup-dotnet's own `cache: true` wants a packages.lock.json and
      # this repo has none (central package management via
      # Directory.Packages.props, no lock files), so the cache is keyed
      # by hand: the props file pins every version, and the csproj set
      # decides which of those are actually pulled. Either changing is
      # the only thing that can change the restore graph.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # #356 — the frontend is vanilla JS run through node:test; these
      # gate the build so a stale fragment path or a broken pure helper
      # fails CI instead of rotting silently (they weren't wired in
      # before, which is how benchmarks.test.mjs drifted to a moved
      # path). No npm install needed — the harness is dependency-free.
      - name: JS unit tests
        # #367 — dual reporter: the `spec` stream on stdout still gates
        # the build (a failing JS test fails the step and prints why),
        # while the `lcov` stream writes real per-fragment coverage to a
        # file for the Codecov `javascript` upload below. The suite is
        # compiled via vm.compileFunction with each fragment's real
        # filename (tests/.../_load-fragment.mjs), so V8 attributes
        # coverage to src/**/wwwroot/** instead of the anonymous
        # evalmachine script node's reporter used to drop.
        # node's lcov reporter does not create its destination directory,
        # and this step runs before the dotnet coverage steps that make
        # artifacts/coverage/, so create it first.
        run: |
          mkdir -p artifacts/coverage
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=artifacts/coverage/js-lcov.info \
            tests/Kuestenlogik.Bowire.Tests/wwwroot-js/*.test.mjs

      # #548 — the release cascade's shell only ever runs during a
      # release, in eleven repos we do not control the checkout of, so
      # a mistake in it stays invisible until it has already shipped a
      # half-bumped dependency set. These tests extract the actual step
      # scripts out of .github/sibling-templates/ and run them against
      # fixtures of every sibling's real reference shapes.
      - name: Release-cascade workflow tests
        # Deckt auch die VS-Code-Extension ab (#101): deren testbare
        # Logik liegt in extensions/bowire-vscode/lib und wird von
        # ci/vscode-extension.test.mjs geprueft.
        run: node --test tests/Kuestenlogik.Bowire.Tests/ci/*.test.mjs

      # No version step needed — MinVer derives the version from git for
      # every build (untagged CI => an X.Y.Z-alpha.N prerelease). CI packages
      # are inspection-only artefacts and never published, so the exact
      # prerelease string is immaterial here.
      - name: Restore
        run: dotnet restore Kuestenlogik.Bowire.slnx

      - name: Build
        run: dotnet build Kuestenlogik.Bowire.slnx -c Release --no-restore

      - name: Test
        # Runs under Microsoft.Testing.Platform, not VSTest (#601). The
        # switch lives in global.json ("test": { "runner": ... }) — MTP 2.x
        # removed the VSTest bridge on the .NET 10 SDK, so there is no
        # opting out any more, only opting in. Consequences visible here:
        # `--solution` instead of a positional path, `--filter-not-trait`
        # instead of `--filter "Category!=Docker"`, and `--coverage` instead
        # of the `--collect:"XPlat Code Coverage"` collector.
        #
        # Coverage still lands as one cobertura file per test project under
        # artifacts/coverage/raw/. We merge them in the next step before
        # uploading — Codecov's server-side merge de-duplicates by file but
        # doesn't union per-line hits across sessions, which under-counts
        # lines that one project covers while another one doesn't (~6 pp gap
        # measured on this repo).
        #
        # --filter-not-trait skips the Testcontainers-backed integration
        # suites (NATS / Pulsar live-broker round-trips). They're tagged
        # [Trait("Category","Docker")] precisely so they opt out here: the
        # hosted runner's Docker Hub pulls are rate-limited / flaky (manifest
        # fetch for nats:2-alpine fails intermittently), and these tests are
        # meant for local / dev runs with a working Docker daemon. Measured
        # after the switch: 480 of 494 integration tests run, the excluded 14
        # are exactly the Docker-tagged ones.
        run: >
          dotnet test --solution Kuestenlogik.Bowire.slnx -c Release --no-build
          --filter-not-trait "Category=Docker"
          --coverage
          --coverage-output-format cobertura
          --results-directory artifacts/coverage/raw

      - name: Merge coverage reports
        # ReportGenerator union-merges per-line hits across all input
        # files into one Cobertura output. Filters mirror codecov.yml's
        # `ignore` list so the merged file already excludes obj/, bin/,
        # wwwroot/, tests/, samples/, benchmarks/. We then delete the
        # raw per-test-project files so Codecov's auto-search only
        # finds the merged one — `files:` alone doesn't suppress the
        # auto-search, it only adds explicit picks on top.
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:'artifacts/coverage/raw/*.cobertura.xml' \
            -targetdir:artifacts/coverage/merged \
            -reporttypes:Cobertura \
            -filefilters:'-**/obj/**;-**/wwwroot/**;-**/bin/**;-tests/**;-samples/**;-benchmarks/**'
          rm -rf artifacts/coverage/raw

      - name: Upload coverage to Codecov
        # Skip when running on a fork PR — Codecov tokenless uploads
        # work on push events but the secret isn't injected into PRs
        # from forks, so the upload would fail noisily for outside
        # contributors.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: artifacts/coverage/merged/Cobertura.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload JS coverage to Codecov
        # #367 — the vanilla-JS frontend under wwwroot is run through
        # node:test, not dotnet, so it needs its own lcov upload under a
        # dedicated `javascript` flag. The global `ignore: src/**/wwwroot/**`
        # in codecov.yml keeps the C# number honest; the flag's `paths:`
        # entry re-includes exactly those files for this upload only.
        # Same fork guard as the C# upload above.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: artifacts/coverage/js-lcov.info
          flags: javascript
          fail_ci_if_error: false

      - name: Pack
        run: dotnet pack Kuestenlogik.Bowire.slnx -c Release --no-build -o artifacts/packages

      # CI artefacts are uploaded for inspection but NOT published to
      # any feed — release.yml owns the publish path on tag push.
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg

  # Browser-level regression gate. Separate job so a ~2-minute browser
  # run never sits in front of the build/pack feedback above.
  #
  # tests/e2e/ existed since #356 but ran in no workflow at all — the only
  # Playwright call in CI rendered the docs PDF. That gap is why the
  # streaming-layout regression shipped twice: it was found by hand,
  # verified by hand, and nothing held it afterwards.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Same key as the build job, so whichever of the two lands first
      # populates the cache the other one reads.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Node deps
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx --yes playwright install chromium --with-deps

      # playwright.config.ts spawns both servers itself, but its 180s
      # readiness budget is per server and a cold `dotnet run` would spend
      # most of it restoring and compiling. Building first keeps the spawn
      # inside the budget on a slow runner.
      - name: Build Tool + SSE sample
        run: |
          dotnet build src/Kuestenlogik.Bowire.Tool/Kuestenlogik.Bowire.Tool.csproj -c Release
          dotnet build samples/Kuestenlogik.Bowire.Sample.Sse/Kuestenlogik.Bowire.Sample.Sse.csproj -c Release

      - name: E2E tests
        run: npm run test:e2e

      # trace / screenshot / video are configured retain-on-failure, so
      # this is empty on a green run and carries the evidence on a red one.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
