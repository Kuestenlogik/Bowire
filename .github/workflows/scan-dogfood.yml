name: "Scan: dogfood"

# Bowire's scanner against Bowire's own HTTP surface.
#
# This is deliberately NOT the same job as `Scan: self-smoke` (scan-self.yml),
# and the split is the point:
#
#   * self-smoke answers "does the composite action still run end-to-end?".
#     It scans example.com precisely because that target is stable and needs
#     nothing started, and it does NOT upload — example.com's missing security
#     headers belong to example.com, not to us.
#   * this job answers "is our own surface clean?". It starts a sample we ship
#     and uploads the findings, because those findings ARE ours.
#
# Keeping them apart means a flaky sample start-up cannot masquerade as a
# regression in the action, and a broken action cannot quietly stop reporting
# on our own code.
#
# Sample.Rest is the target because it is a service we ship and it mounts the
# workbench via `MapBowire("/bowire")`, so what gets probed is ours.
#
# Measured, so the expectation is honest rather than hopeful: against the
# current sample this produces exactly two findings at medium+, and both are
# host-level rather than endpoint-specific. Pointing the scan at /bowire
# directly yields the same two and exercises FEWER Top-10 entries (4 of 10
# instead of 5), which is why the root is the target.
#
#   BWR-BUILTIN-TLS-001      high    plaintext http:// — an artefact of a dev
#                                    server on localhost, not a defect. Dismiss
#                                    it once in the Security tab with a reason.
#   BWR-OWASP-API4-RATELIMIT medium  no rate limiting — true of the sample, and
#                                    worth knowing for an embedding host.
#
# So the value here is a regression tripwire and a populated tool entry, not a
# flood of insight. Triage belongs in the Security tab, where a dismissal is
# visible and reversible — not in a severity flag here, where it would look
# like the finding never happened. The floor below drops the tier that talks
# about localhost rather than about Bowire; it is not a way to hide anything.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'samples/Kuestenlogik.Bowire.Sample.Rest/**'
      - '.github/actions/bowire-scan/**'
      - '.github/workflows/scan-dogfood.yml'
  # Weekly, so a finding that only appears with an updated template corpus or
  # a new probe surfaces without waiting for someone to touch src/.
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

concurrency:
  group: scan-dogfood-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for the Code Scanning upload — without it the upload is a no-op
  # and the job stays green while reporting nothing.
  security-events: write

jobs:
  dogfood:
    name: scan Sample.Rest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build Sample.Rest
        run: dotnet build samples/Kuestenlogik.Bowire.Sample.Rest -c Release -m:1 -nodeReuse:false

      # Started detached and waited for by its own banner rather than a fixed
      # sleep: the sample restores plugins on first run, and a sleep long
      # enough to be safe is long enough to waste every run.
      - name: Start Sample.Rest
        run: |
          set -euo pipefail
          nohup dotnet artifacts/bin/Kuestenlogik.Bowire.Sample.Rest/Release/Kuestenlogik.Bowire.Sample.Rest.dll \
            > sample.log 2>&1 &
          echo $! > sample.pid

          for _ in $(seq 1 60); do
            if grep -q 'Now listening on' sample.log; then
              echo "Sample is up:"
              grep 'Now listening on' sample.log
              exit 0
            fi
            # A crash must not be waited out for the full minute — and it must
            # not look like a slow start either.
            if ! kill -0 "$(cat sample.pid)" 2>/dev/null; then
              echo "::error::Sample.Rest exited before it started serving."
              cat sample.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::Sample.Rest did not report a listening URL within 60s."
          cat sample.log
          exit 1
        env:
          DOTNET_ENVIRONMENT: Production

      - name: Scan it
        uses: ./.github/actions/bowire-scan
        with:
          # The port Sample.Rest binds (samples/…/Program.cs: UseUrls).
          target: http://localhost:5181
          templates: docs/security/examples
          suite: owasp-api
          # medium+ on purpose. The low tier here is dominated by findings
          # about the harness rather than the code — no TLS on a localhost dev
          # server, a Kestrel banner — and a Security tab that cries wolf is a
          # Security tab nobody reads.
          severity: medium
          upload-to-code-scanning: 'true'

      - name: Stop Sample.Rest
        if: always()
        run: |
          if [ -f sample.pid ]; then
            kill "$(cat sample.pid)" 2>/dev/null || true
          fi

      # The sample's own log is the fastest route to a diagnosis when the scan
      # reports something surprising, and it is gone once the job ends.
      - name: Upload sample log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-sample-log
          path: sample.log
          retention-days: 7
          if-no-files-found: ignore
