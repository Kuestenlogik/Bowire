name: "Scan: dogfood"

# Bowire's scanner against a service Bowire ships — as an ASSERTION, not a
# report. The expected findings live in scripts/ci/expected-scan-findings.json
# and the job is green exactly while reality matches them.
#
# The first cut of this workflow uploaded its SARIF to Code Scanning, and that
# was wrong. The target is a sample we start ourselves, so its findings
# describe the harness: "serves plaintext http://" is true of any dev server on
# localhost and says nothing about Bowire. Uploaded, it appears in Bowire's own
# Security tab as a high-severity alert against Bowire, and a reader concludes
# the product has a TLS problem. It does not — the CI scaffolding does, by
# design. That is the same mistake scan-self.yml already avoids by not
# uploading example.com's missing headers, made a second time.
#
# The assertion is also the stricter test. An upload is satisfied by any output
# at all, so a scanner that quietly stopped finding ANYTHING would stay green —
# the precise regression this job exists to catch. Pinning the set fails both
# ways: a finding that disappears means a probe broke; one that appears means
# the sample regressed or a new probe fires. Both deserve a red build. Neither
# deserves a security alert.
#
# Still deliberately separate from `Scan: self-smoke`:
#
#   * self-smoke answers "does the composite action still run end-to-end?" and
#     scans example.com because that target is stable and needs nothing started.
#   * this job answers "does the scanner still find what it should?" and needs a
#     target we control, so it starts one.
#
# Apart, a flaky sample start-up cannot masquerade as a broken action, and a
# broken action cannot quietly stop exercising the probes.
#
# Sample.Rest is the target because it has real endpoints, binds a known port
# and mounts the workbench via `MapBowire("/bowire")`. Measured: scanning
# /bowire directly yields the same findings and exercises FEWER Top-10 entries
# (4 of 10 instead of 5), so the root is the better target.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'samples/Kuestenlogik.Bowire.Sample.Rest/**'
      - '.github/actions/bowire-scan/**'
      - '.github/workflows/scan-dogfood.yml'
      - 'scripts/ci/assert-scan-findings.mjs'
      - 'scripts/ci/expected-scan-findings.json'
  # Weekly, so a finding that only appears with an updated template corpus or
  # a new probe surfaces without waiting for someone to touch src/.
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

concurrency:
  group: scan-dogfood-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this job asserts, it does not publish. `security-events: write`
# would only be needed for a Code Scanning upload, and deliberately not doing
# that upload is the whole design (see the header).
permissions:
  contents: read

jobs:
  dogfood:
    name: scan Sample.Rest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build Sample.Rest
        run: dotnet build samples/Kuestenlogik.Bowire.Sample.Rest -c Release -m:1 -nodeReuse:false

      # Started detached and waited for by its own banner rather than a fixed
      # sleep: the sample restores plugins on first run, and a sleep long
      # enough to be safe is long enough to waste every run.
      - name: Start Sample.Rest
        run: |
          set -euo pipefail
          nohup dotnet artifacts/bin/Kuestenlogik.Bowire.Sample.Rest/Release/Kuestenlogik.Bowire.Sample.Rest.dll \
            > sample.log 2>&1 &
          echo $! > sample.pid

          for _ in $(seq 1 60); do
            if grep -q 'Now listening on' sample.log; then
              echo "Sample is up:"
              grep 'Now listening on' sample.log
              exit 0
            fi
            # A crash must not be waited out for the full minute — and it must
            # not look like a slow start either.
            if ! kill -0 "$(cat sample.pid)" 2>/dev/null; then
              echo "::error::Sample.Rest exited before it started serving."
              cat sample.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::Sample.Rest did not report a listening URL within 60s."
          cat sample.log
          exit 1
        env:
          DOTNET_ENVIRONMENT: Production

      - name: Scan it
        uses: ./.github/actions/bowire-scan
        with:
          # The port Sample.Rest binds (samples/…/Program.cs: UseUrls).
          target: http://localhost:5181
          templates: docs/security/examples
          suite: owasp-api
          # medium+ keeps the expectation about findings that mean something.
          # The low tier is dominated by banner-level noise whose presence
          # depends on the runner image, which would make the assertion
          # brittle for reasons unrelated to Bowire.
          severity: medium
          # See the header: the findings describe the harness, so uploading
          # them would put alerts against Bowire that Bowire has not earned.
          upload-to-code-scanning: 'false'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Assert the findings are exactly what we expect
        run: >
          node scripts/ci/assert-scan-findings.mjs
          findings.sarif
          scripts/ci/expected-scan-findings.json

      - name: Stop Sample.Rest
        if: always()
        run: |
          if [ -f sample.pid ]; then
            kill "$(cat sample.pid)" 2>/dev/null || true
          fi

      # The sample's own log is the fastest route to a diagnosis when the scan
      # reports something surprising, and it is gone once the job ends.
      - name: Upload sample log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-sample-log
          path: sample.log
          retention-days: 7
          if-no-files-found: ignore
