name: "VS Code extension"

# Packages the extension on every change, and publishes it only when asked.
#
# The split matters. Packaging is the check: `vsce package` is what catches a
# manifest that no longer parses, a missing icon, an absent licence, or files
# that should not ship — and none of those are worth discovering during a
# release. So it runs on every push that touches the extension, and the VSIX
# is kept as an artifact you can install with `code --install-extension` to
# try the exact bytes that would go to the marketplace.
#
# Publishing is a separate, deliberate act: `workflow_dispatch` with
# `publish: true`. It is not wired to a tag, because the extension's version
# is deliberately independent of Bowire's release cadence (#101) — tying it to
# the release train would recreate the lockstep the design set out to avoid.
#
# The publish authenticates with Microsoft Entra ID (#613): an app
# registration with a federated credential for this repository, a member of
# the `kuestenlogik` publisher with the Contributor role. The credential is
# minted per run over OIDC, so no secret for it exists in this repository.
# The repository variables AZURE_CLIENT_ID and AZURE_TENANT_ID name the
# identity; the repository's OIDC subject uses the immutable form
# (repo:Kuestenlogik@<org id>/Bowire@<repo id>:...), which is what the
# federated credential expects.
#
# The PAT path was removed after 1.0.1 published this way: Azure DevOps
# retires the globally scoped PATs `vsce` used on 2026-12-01.
#
# To add the identity to a publisher you need its Marketplace user id, which
# only the identity itself can read; `whoami: true` prints it.

on:
  push:
    branches: [main]
    paths:
      - 'extensions/bowire-vscode/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'extensions/bowire-vscode/**'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the VS Code Marketplace (otherwise: package only)'
        type: boolean
        default: false
      whoami:
        description: 'Print the Marketplace user id of the Entra ID identity, to add it to the publisher (#613). Publishes nothing.'
        type: boolean
        default: false

concurrency:
  # A push-triggered run must not be cancelled by the next push: on main
  # every commit is its own subject, and superseding one loses that
  # commit's result rather than saving work. Keying the group on the sha
  # for pushes keeps them independent, while a pull request still
  # collapses onto one shared key so a re-push supersedes the last run.
  group: vscode-extension-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: true

permissions:
  contents: read
  # For the Entra ID publish path (#613): lets the run mint an OIDC token
  # that Azure exchanges for a short-lived credential. Harmless on every
  # other run — a token nobody requests is never issued.
  id-token: write

jobs:
  package:
    name: package (and publish on demand)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The extension is plain CommonJS with no build step, so its logic is
      # covered by node:test in the main test project rather than by anything
      # under extensions/. Running it here as well means a broken manifest or
      # a moved icon fails on the PR that causes it.
      - name: Unit tests
        run: node --test tests/Kuestenlogik.Bowire.Tests/ci/vscode-extension.test.mjs

      - name: Package
        working-directory: extensions/bowire-vscode
        run: |
          set -euo pipefail
          npx --yes @vscode/vsce@latest package --no-dependencies --out bowire-vscode.vsix
          ls -la bowire-vscode.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: bowire-vscode-vsix
          path: extensions/bowire-vscode/bowire-vscode.vsix
          retention-days: 30

      # Without the two variables azure/login fails with a message about a
      # missing client id that does not say where it should come from.
      - name: Check the Entra ID identity is configured
        if: github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.whoami)
        env:
          HAS_ENTRA: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' }}
        run: |
          if [ "${HAS_ENTRA}" != "true" ]; then
            echo "::error::Set the AZURE_CLIENT_ID and AZURE_TENANT_ID repository variables (#613)."
            exit 1
          fi

      # Entra ID over OIDC (#613). The same login serves `whoami`.
      - name: Azure login (OIDC)
        if: github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.whoami)
        # Pinned to a commit, not to `v2`: this is a third-party action that
        # runs in a job holding an id-token, and a moving tag is a decision
        # someone else can make on our behalf later. (CodeQL alert #1828.)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The publisher identity needs no subscription, and demanding one
          # would mean granting this run more than it uses.
          allow-no-subscriptions: true

      # The publisher takes a new member by its Marketplace user id, not by
      # client id or e-mail, and that id is only visible to the identity
      # itself. An identity with nothing but a federated credential can only
      # sign in from a run like this one, so the run asks for it (#613).
      - name: Marketplace user id of the Entra ID identity
        if: github.event_name == 'workflow_dispatch' && inputs.whoami
        run: |
          set -euo pipefail
          # 499b84ac-1321-427f-aa17-267ca6975798 is Azure DevOps, which the
          # Marketplace profile belongs to.
          profile=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798)
          id=$(jq -r '.id' <<<"${profile}")
          name=$(jq -r '.displayName // empty' <<<"${profile}")
          echo "Marketplace user id: ${id} (${name})"
          {
            echo "### Marketplace user id"
            echo
            echo "\`${id}\` — ${name}"
            echo
            echo "Add it at https://marketplace.visualstudio.com/manage/publishers/kuestenlogik → Members → Add, role **Contributor**."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Deliberately not `continue-on-error`. If you asked for a publish and it
      # cannot happen, that is a failure worth seeing — the winget channel
      # taught us what silent publish failures cost (#237).
      - name: Publish to Marketplace
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        working-directory: extensions/bowire-vscode
        run: |
          # --azure-credential picks up the login above through
          # DefaultAzureCredential. The token is minted per run and dies
          # with the job.
          npx --yes @vscode/vsce@latest publish --no-dependencies --azure-credential --packagePath bowire-vscode.vsix
