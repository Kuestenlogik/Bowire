# Dependabot-PRs mergen sich selbst — Trunk-Workflow ohne PR-Zeremonie.
# Dependabot kennt keinen Direkt-Commit; der PR ist sein einziger Weg. Bowires
# main verlangt den "build"-Statuscheck, den GITHUB_TOKEN nicht umgehen kann —
# darum --auto: der Merge wird vorgemerkt und feuert, sobald der Pflicht-Check
# grün ist (Repo-Setting allow_auto_merge ist aktiv).
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Merge vormerken (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --auto "$PR_URL"
