name: Roadmap sync

# Regenerate ROADMAP.md from the Bowire GitHub Project (org-level
# project #2) so the Markdown stays in sync with the canonical
# Project board. The Project is the source of truth; this file just
# materialises it for offline / non-API consumers.
#
# Triggers:
#   * issues — an issue filed, edited, closed, labelled, or moved
#     between milestones changes what the file renders.
#   * milestone — the version headings, themes and due dates come
#     straight off the main-repo milestones, so an edit there changes
#     the output without touching a single issue. Without this, moving
#     a release date left the rendered dates stale until the nightly.
#   * pull_request — verify ROADMAP.md isn't manually edited drifting
#     from the Project.
#   * workflow_dispatch — manual kick.
#   * schedule (daily) — the safety net, and the ONLY thing that picks
#     up a board-field change. Projects V2 emits no repository event a
#     workflow can subscribe to (there is no `project_v2:` trigger), so
#     a Status / Release edit stays invisible here until the nightly run.
#
# Auth: reuses the org-secret BOWIRE_DISPATCH_TOKEN — the same PAT
# that powers roadmap-field-guard.yml and Bowire.Bootcamp's notify
# workflow. Required scopes on top of repo (Contents R/W):
#   - Organization projects: Read and write
#   - Issues: Read and write
#   - Pull requests: Read

on:
  issues:
    types: [opened, edited, deleted, transferred, milestoned, demilestoned, labeled, unlabeled, closed, reopened]
  milestone:
    types: [created, opened, edited, closed, deleted]
  pull_request:
    paths:
      - 'ROADMAP.md'
      - 'scripts/ci/generate-roadmap.mjs'
      - '.github/workflows/roadmap-sync.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate ROADMAP.md
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need write-token + full history so a follow-up commit lands cleanly.
          fetch-depth: 0
          token: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # The checkout is pinned to the triggering SHA, and main often moves
      # before the push (a queued sync in the concurrency group, a burst
      # of milestone edits, a regular push). The file is fully generated,
      # so on a rejected push: reset to the fresh origin/main, regenerate,
      # and try again rather than rebasing a stale ROADMAP.md.
      - name: Regenerate, commit and push
        env:
          GH_TOKEN: ${{ secrets.BOWIRE_DISPATCH_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/ci/generate-roadmap.mjs
            if git diff --quiet ROADMAP.md; then
              echo "ROADMAP.md is already up to date."
              exit 0
            fi
            git add ROADMAP.md
            git commit -m "chore(roadmap): sync from Project board"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), main moved — retrying on the new tip."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push ROADMAP.md after 5 attempts."
          exit 1

  check:
    name: PR check — ROADMAP.md matches Project
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Verify ROADMAP.md is up to date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/generate-roadmap.mjs --check
