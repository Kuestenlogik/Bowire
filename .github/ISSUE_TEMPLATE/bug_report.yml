name: Bug Report
description: Report a bug in Bowire
# Every issue lands on the board without a label (project-add.yml); the
# `roadmap` label was retired on 2026-09-30.
# The old `kind:bug` is gone: that label does not exist in this repo, and
# GitHub drops unknown labels from a template SILENTLY, so bug reports were
# arriving with no label at all, never reaching the board through the
# workflow. What kind of issue this is now lives in the native issue Type,
# not in a label.
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
  - type: input
    attributes:
      label: Bowire Version
      placeholder: "0.9.4"
  - type: input
    attributes:
      label: .NET Version
      placeholder: "10.0"
