name: Bug Report
description: Report a bug in Bowire
# `roadmap` is the board's admission ticket — the Project's own "Auto-add to
# project" rule filters on it.
# The old `kind:bug` is gone: that label does not exist in this repo, and
# GitHub drops unknown labels from a template SILENTLY, so bug reports were
# arriving with no label at all, never reaching the board through the
# workflow. What kind of issue this is now lives in the native issue Type,
# not in a label.
labels: ["roadmap"]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
  - type: input
    attributes:
      label: Bowire Version
      placeholder: "0.9.4"
  - type: input
    attributes:
      label: .NET Version
      placeholder: "10.0"
