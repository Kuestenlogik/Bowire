name: Feature Request
description: Suggest a new feature
# `roadmap` gets it onto the board (the Project's own "Auto-add to project"
# rule filters on it);
# `community-vote` is what the voting view filters by. The old
# `kind:feature` is gone — the label does not exist here, GitHub drops
# unknown template labels silently, and the kind now lives in the native
# issue Type rather than in a label.
labels: ["roadmap", "community-vote"]
body:
  - type: textarea
    attributes:
      label: Description
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use Case
      description: Why is this useful?
  - type: dropdown
    attributes:
      label: Area
      description: Which component does this affect? (Project board uses the same axis)
      options:
        - workbench (UI)
        - cli
        - security (scan / fuzz / jwt / proxy)
        - mcp (server / adapter)
        - plugin-sdk
        - mock
        - docs
        - site (bowire.io)
        - bootcamp
        - multi (cross-cutting)
        - unsure
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        > **Reactions count as priority signal.** If you want this feature, give the issue a 👍 instead of commenting "+1".
