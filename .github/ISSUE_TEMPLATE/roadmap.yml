name: Roadmap item
description: Track a roadmap-scoped piece of work (lands on the Project board, version-targeted)
labels: ["roadmap"]
body:
  - type: markdown
    attributes:
      value: |
        For roadmap-scoped work. This template lands on the [Bowire Project board](https://github.com/orgs/Kuestenlogik/projects/2) automatically (via Auto-add-to-project). For bug reports use the *Bug Report* template; for one-off feature ideas use *Feature Request*.
  - type: textarea
    attributes:
      label: Summary
      description: One short paragraph. What is this, why does it matter?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Checklist
      description: Bullet list of concrete work items. Tick them off as PRs land.
      placeholder: |
        - [ ] First sub-task
        - [ ] Second sub-task
        - [ ] Documentation
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      description: Component axis on the board
      options:
        - workbench (UI)
        - cli
        - security
        - mcp
        - plugin-sdk
        - mock
        - docs
        - site
        - bootcamp
        - multi (cross-cutting)
    validations:
      required: true
  # Two dropdowns used to sit here and both had rotted:
  #
  #   "Kind" (feature / debt / docs / rfc / concept) predates the native
  #   GitHub issue Type. The kind now lives in the Type field on the issue
  #   itself (Bug / Feature / Task), so asking for it again in the body
  #   produced a second answer that nothing read and nothing kept in step.
  #
  #   "Target milestone" offered v1.5 / v1.6 / v2.0 / Later — a hardcoded
  #   list that was already three minors behind, so anyone filing an issue
  #   could only pick versions that had shipped. It also contradicts how
  #   scheduling works: `Release` stays empty until the item is pulled out
  #   of Backlog, because pulling it IS the decision about when it ships.
  #
  # Both are triage decisions made on the board, where the values cannot go
  # stale, rather than questions asked of the reporter at filing time.
  - type: markdown
    attributes:
      value: |
        > **Triage will set** `Status` (Backlog → Next up → In progress → In review → Done) and `Area` on the Project board, plus `Release` once the item is pulled out of Backlog — an item still resting in Backlog carries no version, and that is correct.
        >
        > `Priority` and the issue **Type** (Bug / Feature / Task) live on the issue itself, in the right-hand sidebar — not on the board.
