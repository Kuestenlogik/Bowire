name: 'Report a publish failure'
description: >-
  File (or update) a tracking issue when an artefact publish fails, so a broken
  distribution channel cannot rot silently beside a green release.

# Why this exists (#237): the winget submission failed on seven consecutive
# releases — an expired token, then a fork that had drifted 31k commits behind
# upstream — and nobody noticed, because the publish workflows run *after* the
# release and fail on their own. The release itself stayed green, so `winget
# install` quietly served a version four minors old for two months.
#
# A failing publish now leaves a mark that outlives the run: one open issue per
# channel, updated on each further failure rather than duplicated. Reused by
# every artefact workflow (winget, chocolatey, homebrew, the release build)
# instead of copying the same block four times.
#
# Idempotency: the action looks for an OPEN issue carrying this channel's
# marker. Found → comment on it. Not found → open a new one. A channel that was
# fixed and its issue closed therefore gets a fresh issue the next time it
# breaks, rather than resurrecting a closed one.

inputs:
  channel:
    description: 'Distribution channel that failed (winget, chocolatey, homebrew, release artefacts, …).'
    required: true
  version:
    description: 'Version being published, when known.'
    required: false
    default: ''
  hint:
    description: 'Channel-specific first thing to check, appended to the issue body.'
    required: false
    default: ''
  token:
    description: 'Token used to file the issue. Needs issues: write.'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Inputs travel through the environment, never through string
    # interpolation into the script.
    #
    # They used to be spliced straight into JS template literals, and every
    # caller's hint contains backticks — `homebrew-bowire`, `WINGET_TOKEN`,
    # `public_repo`. Those closed the literal, so the step died with
    # `SyntaxError: Unexpected identifier` before it could file anything.
    #
    # Which means the mechanism built to make silent publish failures visible
    # (#237) was itself failing silently: Homebrew and Winget both went down
    # on v2.6.1, and neither raised the issue it was supposed to. Reading it
    # out of process.env also removes the script-injection shape, where a
    # value could close the literal and run its own code.
    - uses: actions/github-script@v7
      env:
        PUBLISH_CHANNEL: ${{ inputs.channel }}
        PUBLISH_VERSION: ${{ inputs.version }}
        PUBLISH_HINT: ${{ inputs.hint }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const channel = process.env.PUBLISH_CHANNEL || '';
          const version = process.env.PUBLISH_VERSION || '';
          const hint = process.env.PUBLISH_HINT || '';
          const marker = `<!-- publish-failure:${channel} -->`;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const versionText = version ? ` for \`${version}\`` : '';

          const body = [
            marker,
            `The **${channel}** publish failed${versionText}.`,
            '',
            `- Run: ${runUrl}`,
            `- Workflow: \`${context.workflow}\``,
            `- Commit: ${context.sha}`,
            hint ? `\nFirst thing to check: ${hint}` : '',
            '',
            'Until this is fixed that channel keeps serving the previously published version, ' +
            'while the release itself looks green — which is exactly how this went unnoticed ' +
            'for seven releases before (#237). Close this issue once a publish succeeds.',
          ].filter(Boolean).join('\n');

          // Reuse an open issue for this channel rather than filing one per
          // failed release; a channel that breaks on every release would
          // otherwise bury the tracker.
          const existing = await github.paginate(github.rest.issues.listForRepo, {
            ...context.repo,
            state: 'open',
            per_page: 100,
          });
          const match = existing.find(i => !i.pull_request && i.body && i.body.includes(marker));

          if (match) {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: match.number,
              body,
            });
            core.warning(`${channel} publish failed again — updated issue #${match.number}.`);
            return;
          }

          const created = await github.rest.issues.create({
            ...context.repo,
            title: `${channel} publish is failing${versionText}`,
            body,
          });
          core.warning(`${channel} publish failed — filed issue #${created.data.number}.`);
