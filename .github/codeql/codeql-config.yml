# CodeQL configuration for Bowire — switched from Default Setup to
# Advanced Setup so we can:
#
#   1. Register Kuestenlogik.Bowire.Interceptor.LogSanitizer.Strip as
#      a known sanitiser for the cs/log-forging query (closes CodeQL
#      alerts #1786-#1791 properly instead of dismissing). The data
#      extension that does this lives at
#      .github/codeql/extensions/bowire-log-sanitiser.yml + is wired
#      into the scan via the `packs:` block below.
#
#      That technique is C#-only, and the reason is worth writing down
#      so nobody re-derives it: C#'s dataflow consults models-as-data
#      barriers globally, so a `barrierModel` row reaches every flow
#      query. JavaScript's do not. `js/http-to-file-access`, for one,
#      declares its only barrier as an abstract QL class with no
#      implementation --
#
#          abstract class Sanitizer extends DataFlow::Node { }
#          predicate isBarrier(DataFlow::Node n) { n instanceof Sanitizer }
#
#      -- and never reads a model. `codeql/javascript-all` does declare
#      `barrierModel` (3 columns, no `provenance`, unlike C#'s 9), but
#      that query ignores it, so a row there would be inert rather than
#      wrong.
#
#      The QL hook does not reach it either. `javascript.qll` runs
#      `import Customizations`, and that file's own doc comment offers
#      exactly this use -- but the import resolves inside
#      `codeql/javascript-all`, so a `Customizations.qll` shipped in
#      another pack is never imported by anything. Published query packs
#      also carry `.qlx` next to `.ql`, and the precompiled artefact wins
#      even when the source path is passed explicitly.
#
#      Measured with CodeQL CLI 2.26.4 against a real JS database, for
#      alert #1836 (js/http-to-file-access in
#      scripts/docs/fetch-plugin-docs.mjs): stock query 1 finding;
#      --additional-packs with a Customizations.qll 1; the same with
#      --rerun 1; the query copied into that pack and compiled from
#      source 1; the copy with the sanitiser imported EXPLICITLY 0. The
#      class works; the injection does not.
#
#      So the only route that reaches the Action is a repo-local pack
#      holding a COPY of the rule that imports the sanitiser, plus a
#      query-filter excluding the stock one -- a fork of an upstream
#      security query, which then drifts and silences the real rule
#      repo-wide. #1836 is dismissed with a written reason instead; the
#      flow it names is validated by rejectPage() in
#      scripts/docs/plugin-docs.mjs and covered by
#      tests/Kuestenlogik.Bowire.Tests/ci/plugin-doc-page.test.mjs.
#
#   2. Skip dev-tooling paths (Playwright screenshot scripts, marketing
#      PDF build helpers, ad-hoc UX tests) that legitimately disable
#      cert validation against self-signed localhost dev servers OR
#      run inside a controlled localhost-only context. CodeQL's
#      threat model assumes production code; flagging dev-tools as
#      "remote attack surface" produces noise without security value.
#
# Re-enabling Default Setup requires removing this file + the
# .github/workflows/codeql.yml workflow + re-enabling Default Setup
# via the repo's Security & analysis settings.

name: Bowire CodeQL config

# Same query suite Default Setup uses — security-extended pulls in
# every default + a curated set of additional queries that catch
# more sources without too many false positives.
queries:
  - uses: security-extended

# Pack reference. Wires our local extension YAML into the analyser so
# every C# scan sees LogSanitizer.Strip as a sanitiser node.
packs:
  - ./.github/codeql/extensions

paths-ignore:
  # NOTE: samples/** is deliberately NOT excluded — sample code is scanned so
  # real bugs a user might copy get caught. The demo servers' intentional
  # "missing function-level access control" findings (the unauthenticated OData
  # CRUD, alerts #1811/#1812) are handled by *dismissing* them ("won't fix"),
  # which is sticky across re-scans, rather than by excluding the whole tree.

  # Playwright drivers for screenshots + the recorded demo. They
  # hit localhost dev samples over https with self-signed dev certs
  # (rejectUnauthorized:false) which is correct in this scope but
  # trips js/disabling-certificate-validation. Capturing UI screens
  # is not a production attack surface.
  - 'scripts/screenshots/**'

  # Marketing-site build helpers (Jekyll, PDF render, activity
  # snapshot, etc). They run only on the documentation-build runner,
  # never inside the workbench process, + serve content from a
  # localhost-ephemeral port that only Playwright connects to.
  - 'scripts/site/**'

  # Ad-hoc UX assertion / probe scripts. Disposable; not part of
  # the shipping product.
  - 'scripts/ux-tests/**'

  # Smoke tests that drive sample servers. Same justification as
  # screenshots — localhost-only dev context.
  - 'scripts/smoke/**'

  # Branding asset generation helpers (logos, splash, etc).
  - 'scripts/branding/**'

  # Coverage report post-processors — read xUnit + Cobertura output,
  # never touch network input.
  - 'scripts/coverage/**'

  # Static site output (Jekyll-built HTML, downloaded MapLibre
  # bundle, demo videos) — generated artifacts, not source.
  - 'site/**'

  # The runtime `wwwroot/bowire.js` is stitched at build time from the
  # <BowireJsFragment> files in the .csproj. prologue.js OPENS the shared
  # IIFE and init.js CLOSES it, so each is syntactically incomplete on its
  # own (unbalanced `(function () { … })();`) and the JS extractor cannot
  # parse it — surfacing as "Could not process some files due to syntax
  # errors". Their `// @generated` header only suppresses query *results*,
  # not the extraction diagnostic, so the two IIFE-boundary fragments must
  # be excluded from extraction here. They are unparseable standalone and
  # therefore aren't analysed today anyway — this only silences the noise.
  # The middle fragments parse as top-level statements and stay analysed;
  # the assembled bundle is what actually runs in the browser.
  - 'src/Kuestenlogik.Bowire/wwwroot/js/prologue.js'
  - 'src/Kuestenlogik.Bowire/wwwroot/js/init.js'
