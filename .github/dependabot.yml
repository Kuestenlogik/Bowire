version: 2

# Dependabot keeps Bowire's NuGet + GitHub-Actions + npm dependencies
# fresh on a weekly cadence. Each ecosystem opens at most a handful of
# PRs at a time so the queue can't drown the review process; the
# companion .github/workflows/dependabot-auto-merge.yml auto-merges
# whatever passes CI (squash + delete-branch) so the loop stays
# hands-off for routine bumps.

updates:
  # ---- .NET / NuGet (the bulk of the dependency surface) ----
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      # Sunday night UTC — PRs land in time for Monday-morning review
      # without colliding with weekday work.
      day: "sunday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # Microsoft.OpenApi 3.9+ deprecates IOpenApiSchema.Example without
      # its replacement carrying the data: a 3.0 document's `example:`
      # does NOT appear in `Examples`, so dropping the deprecated read
      # silently loses schema examples for every OpenAPI 3.0 API. Verified
      # against 3.10.0 — see the pin comment in Directory.Packages.props.
      #
      # The range matters. This rule used to name the exact version
      # ["3.9.0"], so 3.10.0 walked straight past it and re-opened the
      # same broken bump under a new number (#578, #581). Pin the range,
      # not the release.
      - dependency-name: "Microsoft.OpenApi"
        versions: [">= 3.9.0"]
      - dependency-name: "Microsoft.OpenApi.YamlReader"
        versions: [">= 3.9.0"]
      # xunit.v3 4.x pulls Microsoft.Testing.Platform 2.x, which has
      # removed the VSTest bridge on .NET 10 — every one of the 43 test
      # projects then fails at Microsoft.Testing.Platform.MSBuild.targets
      # before a single test runs. Taking it means migrating the whole
      # test run (and its coverage collection) off VSTest, which is #601,
      # not a dependency update. Drop this rule with that migration.
      - dependency-name: "xunit.v3"
        versions: [">= 4.0.0"]
      - dependency-name: "xunit.runner.visualstudio"
        versions: [">= 4.0.0"]
      # OllamaSharp 5.4.26+ ships a Roslyn-5.6 source generator; no
      # released .NET 10 SDK carries that compiler yet (10.0.204 is on
      # 5.3), so the bump fails the build with CS9057. Drop this rule
      # when the runners get an SDK with Roslyn 5.6.
      - dependency-name: "OllamaSharp"
        versions: [">= 5.4.26"]
      # Microsoft.OData.Edm/.Core 9.x cannot be restored alongside
      # Microsoft.AspNetCore.OData, which every stable release (through
      # 9.5.0) constrains to Edm >= 8.4.0 && < 9.0.0. The Edm 9.0.0 bump
      # failed the restore with NU1107 and took CI plus the samples smoke
      # down. Drop this rule once AspNetCore.OData 10.x is stable.
      - dependency-name: "Microsoft.OData.Edm"
        versions: [">= 9.0.0"]
      - dependency-name: "Microsoft.OData.Core"
        versions: [">= 9.0.0"]
    groups:
      # Bundle related package families so we don't get one PR per
      # ASP.NET / xUnit / Grpc / Roslyn package on each minor bump.
      grpc:
        patterns:
          - "Grpc.*"
          - "Google.Protobuf*"
      xunit:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore*"
          - "Microsoft.Extensions.*"
      maplibre:
        # The MapLibre extension carries a vendored MapLibre GL JS
        # blob; the NuGet ecosystem doesn't watch the JS, but it
        # does watch the System.Text.Json / Json.NET-style helpers
        # the extension pulls in. Keep them grouped.
        patterns:
          - "*JsonSchema*"
          - "*OpenApi*"

  # ---- GitHub Actions used by .github/workflows/*.yml ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"

  # ---- npm (Playwright + screenshot tooling under scripts/) ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(npm)"
