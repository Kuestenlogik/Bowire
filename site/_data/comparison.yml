# The comparison — one source for the home page's matrix and the /alternatives/* pages (#671).
#
#   tools    every tool compared: its positioning (the "Pick X when…" / "Pick Bowire when…"
#            panel on the home page), whether it is a column of the home page's matrix
#            (in_matrix), and whether the home page lists it at all (on_home: false = only
#            its /alternatives/ page).
#   columns  the home page matrix's columns, in order.
#   rows     the matrix. A row with `rows:` is an expandable group; `cells` are keyed by tool
#            id. A cell: v = what shows, c = yes | no | partial | yes-text, d = the hover detail.
#            A tool without a cell in a row is not claimed either way — the alternatives page
#            leaves that row out rather than guessing.
#
# Facts about other tools date from `as_of`. Wrong or outdated? Correct it here; both pages follow.
as_of: 2026-08
columns:
- bowire
- postman
- scalar
- swashbuckle
- insomnia
- bruno
tools:
- id: bowire
  name: Bowire
  tag: .NET + multi-protocol deployment
  in_matrix: true
- id: postman
  name: Postman
  tag: Cloud teams
  panel_title: Bowire vs. Postman
  pick_them: <strong>Pick Postman</strong> when a distributed team collaborates on curated API collections in the cloud, your stack is primarily REST / GraphQL / WebSocket, and features like Agent Mode, Public Workspaces, and seat-based sync are worth the account + subscription.
  pick_bowire: <strong>Pick Bowire</strong> when you need more protocols (gRPC streaming, SignalR, MCP, MQTT, Socket.IO, OData, &hellip;) in one workbench, want local-first (no Kong/Postman account, no cloud), or need the UI embedded in your ASP.NET service for ops teams.
  in_matrix: true
- id: scalar
  name: Scalar
  tag: API docs
  panel_title: Bowire vs. Scalar
  pick_them: '<strong>Pick Scalar</strong> when your workflow is <em>spec-first</em>: an <code>openapi.yaml</code> / <code>swagger.json</code> is the source of truth, server + clients are generated from it, and you want a polished public docs site with a built-in Try-it console. Scalar reads the spec and renders it beautifully &mdash; great fit for contract-first REST APIs where the contract is designed before implementation.'
  pick_bowire: '<strong>Pick Bowire</strong> when the direction is reversed: a running server is the source of truth and Bowire <em>discovers</em> the contract at runtime (gRPC reflection, the OpenAPI document the server emits, SignalR hub enumeration, GraphQL introspection, &hellip;). Bowire lands one workbench across every protocol your service actually speaks &mdash; not only REST &mdash; and embeds directly inside the ASP.NET app instead of being a separate hosted site.'
  in_matrix: true
- id: swashbuckle
  name: Swashbuckle
  tag: Legacy .NET OpenAPI
  panel_title: Bowire vs. Swashbuckle / <code>Microsoft.AspNetCore.OpenApi</code>
  pick_them: <strong>Pick Swashbuckle</strong> (or Microsoft&rsquo;s new built-in OpenAPI in .NET 9+) when pre-built / offline generation and distribution of OpenAPI specs is enough for your workflow. Note that Swagger UI itself is legacy &mdash; Scalar or Bowire make a simple migration path, both consume the same OpenAPI document you already emit.
  pick_bowire: <strong>Pick Bowire</strong> when the same service exposes gRPC, SignalR, WebSocket, MCP, or other protocols alongside REST. Bowire reads the OpenAPI document you already generate and layers every other protocol on top &mdash; one workbench instead of five different tools.
  in_matrix: true
- id: insomnia
  name: Insomnia
  tag: REST + GraphQL desktop
  panel_title: Bowire vs. Insomnia
  pick_them: <strong>Pick Insomnia</strong> when you want a solid local-first desktop client for REST / GraphQL / gRPC / WebSocket, and you&rsquo;re fine with Kong&rsquo;s account layer for Sync, Teams, and the Dev Portal.
  pick_bowire: <strong>Pick Bowire</strong> when you also need SignalR, MCP, MQTT, Socket.IO, OData, or custom protocols, or when you want the workbench embedded in your ASP.NET service instead of running a separate desktop app. No Kong account required for anything.
  in_matrix: true
- id: bruno
  name: Bruno
  tag: Git-native REST client
  panel_title: Bowire vs. Bruno
  pick_them: <strong>Pick Bruno</strong> when Git-native collections are your priority &mdash; REST / GraphQL / basic gRPC with <code>.bru</code> files committed to your repo. No cloud, no account, just text files reviewed like code.
  pick_bowire: <strong>Pick Bowire</strong> when you need gRPC streaming, GraphQL subscriptions, SignalR hubs, MQTT topics, Socket.IO, or the workbench embedded in your ASP.NET service.
  in_matrix: true
- id: grpcui
  name: gRPC UI / grpcurl
  tag: Single-protocol gRPC
  panel_title: Bowire vs. gRPC UI / grpcurl
  pick_them: <strong>Pick gRPC UI or grpcurl</strong> when you only care about gRPC and want a lightweight, single-purpose tool with minimal setup.
  pick_bowire: <strong>Pick Bowire</strong> when the same service exposes REST or SignalR alongside gRPC and you don&rsquo;t want to switch tools mid-session. Bowire also has a Wireshark-style append-only streaming view that beats the chat-style drawer for long duplex sessions.
  in_matrix: false
- id: mockoon
  name: Mockoon
  tag: Offline HTTP mocks
  panel_title: Bowire vs. Mockoon
  pick_them: '<strong>Pick Mockoon</strong> when you need a quick, free, fully offline mock of an HTTP/REST or WebSocket API, built in a GUI with no account: templating, rules, CRUD data buckets and simulated latency. Its JSON environment files live in git and the same file runs headless in CI through the CLI, the Docker image or the GitHub Action.'
  pick_bowire: '<strong>Pick Bowire</strong> when the mock has to speak more than HTTP and WebSocket &mdash; gRPC (including streaming), SSE, SignalR, MQTT, GraphQL subscriptions &mdash; or when you want the mock to come out of real traffic: record a session against the running service, replay it as a mock with chaos and stateful modes, and use the same workbench to call, test and scan the real thing.'
  in_matrix: false
  on_home: false
- id: hoppscotch
  name: Hoppscotch
  tag: Browser-first client
  panel_title: Bowire vs. Hoppscotch
  pick_them: <strong>Pick Hoppscotch</strong> when you want a fast, lightweight, MIT-licensed API client that runs in the browser with no install, covers REST, GraphQL and the realtime protocols (WebSocket, SSE, Socket.IO, MQTT) in one UI, and a free self-hosted Community Edition via Docker or Helm &mdash; with a cheap upgrade path to SSO / SCIM, published docs and mocks.
  pick_bowire: <strong>Pick Bowire</strong> when the service speaks gRPC, SignalR, MCP, AMQP, NATS, Kafka or OData as well, when the contract should be discovered from the running server instead of maintained in a collection, or when you need record &amp; replay, mocks from real traffic, security scanning and contract tests in the same workbench &mdash; locally, without an account.
  in_matrix: false
  on_home: false
