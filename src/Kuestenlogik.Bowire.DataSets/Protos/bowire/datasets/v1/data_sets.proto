syntax = "proto3";

package bowire.datasets.v1;

option csharp_namespace = "Kuestenlogik.Bowire.DataSets.V1";

import "google/api/annotations.proto";

// Data sets for data-driven runs (#675): a CSV or JSON file whose rows each
// drive one iteration of a run, the row's columns bound as variables.
//
// One parser for every surface: `bowire test --data` and the MCP tools call
// the rpc handler in process, the workbench through the JSON transcoding.
// A file that does not parse fails here, before any request is sent, with
// the line or item that is wrong.
service DataSets {
  // Read a data set into its columns and rows. Unary: the file is in the
  // request, so the rows come back whole rather than paged.
  rpc ParseDataSet(ParseDataSetRequest) returns (ParseDataSetResponse) {
    option (google.api.http) = {
      post: "/api/v1/datasets/parse"
      body: "*"
    };
  }
}

message ParseDataSetRequest {
  // The file's name, for messages and for telling CSV from JSON.
  string file_name = 1;
  // The file's text.
  string content = 2;
  // "csv" or "json"; empty to decide from the name, then the content.
  string format = 3;
}

message ParseDataSetResponse {
  // "csv" or "json".
  string format = 1;
  // Column names in the order they first appear.
  repeated string columns = 2;
  // One row per iteration, in file order.
  repeated DataRow rows = 3;
}

message DataRow {
  // 1-based iteration number.
  int32 iteration = 1;
  // Where the row comes from: the CSV line or the JSON array item (1-based).
  int32 source_line = 2;
  // Column → value. A column a JSON item lacks is absent, so the variable
  // falls through to the environment.
  map<string, string> values = 3;
}
